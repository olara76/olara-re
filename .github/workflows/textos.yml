name: Textos del portal (IA)

# Reescribe y traduce las descripciones de viviendas nuevas o modificadas.
# Necesita el secreto ANTHROPIC_API_KEY en Settings > Secrets and variables > Actions.
on:
  schedule:
    - cron: '17 3 * * *'   # cada noche, 03:17 UTC
  workflow_dispatch:
    inputs:
      max:
        description: 'Máximo de viviendas a procesar'
        default: '200'

permissions:
  contents: write

concurrency:
  group: textos
  cancel-in-progress: false

jobs:
  textos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar textos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/textos.mjs "${{ github.event.inputs.max || '200' }}"
      - name: Guardar cambios
        run: |
          git config user.name "olara-textos-bot"
          git config user.email "info@olara-re.com"
          git add textos
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Textos del portal: actualizacion automatica"
          git pull --rebase origin main
          git push origin HEAD:main
